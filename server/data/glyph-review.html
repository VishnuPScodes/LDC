document.querySelector('#export').addEventListener('click',()=>{const acceptedMappings={},unresolved=[];document.querySelectorAll('.answer').forEach(input=>{const key=input.dataset.key,value=input.value.trim();const row=rows.find(r=>r.key===key);if(value)acceptedMappings[key]={unicode:value,source:prior[key]?'reviewed-existing':'manual-review',previousVotes:row.votes};else unresolved.push({key,questionsAffected:row.questionsAffected,topCandidates:row.candidates})});const data={source:'LDC.pdf; PDF.js operator key (font resource ID, fontChar); reviewed in glyph-review.html',acceptedMappings,unresolved,summary:{uniqueKeys:rows.length,accepted:Object.keys(acceptedMappings).length,unresolved:unresolved.length,affectedQuestions:allAffected.size}};const blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='glyph-map.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></body></html>
